<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rhodes test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #b18cff;
            --accent-link: #c4b0ff;
            --ground: #0c0e11;
            --panel: #141a1f;
            --panel-raised: #1b2229;
            --line: #263038;
            --line-strong: #3a4651;
            --chip: #231d33;
            --text: #e6ecee;
            --text-strong: #f2f6f7;
            --text-body: #c8d1d6;
            --text-muted: #9aa6ad;
            --text-faint: #6f7c84;
            --name-user: #8693a0;
            --danger: #f0a8a8;
        }

        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font: 15px/1.55 Barlow, sans-serif;
        }

        .cut {
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }

        .cut-small {
            clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
        }

        .label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .page {
            max-width: 1260px;
            margin: 0 auto;
            padding: 18px 20px;
            box-sizing: border-box;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            min-height: 100vh;
        }

        nav.chats {
            flex: 0 0 230px;
            position: sticky;
            top: 18px;
            max-height: calc(100vh - 36px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .new-chat {
            min-height: 44px;
            border: 0;
            background: var(--accent);
            color: var(--ground);
            font-size: 16px;
            letter-spacing: 0.14em;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .group-label {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 8px;
        }

        .chat-entry {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px;
            background: none;
            border: 0;
            border-left: 2px solid transparent;
            color: var(--text-body);
            font: 14px Barlow, sans-serif;
            cursor: pointer;
        }

            .chat-entry:hover {
                background: var(--panel);
            }

            .chat-entry.active {
                background: var(--panel);
                border-left-color: var(--accent);
                color: var(--text-strong);
            }

        .chat-title {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            display: block;
            font: 11px 'JetBrains Mono', monospace;
            color: var(--text-faint);
            margin-top: 2px;
        }

        main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .portrait {
            width: 40px;
            height: 40px;
            background: #1f252b;
            border-bottom: 3px solid var(--accent);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: var(--accent);
        }

        .identity-name {
            display: block;
            font-size: 20px;
            letter-spacing: 0.14em;
            color: var(--text-strong);
        }

        .identity-line {
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-chip {
            padding: 5px 8px;
            border: 1px solid var(--line);
            color: var(--text-muted);
            font-size: 12px;
        }

        .conversation {
            background: var(--panel);
            border-top: 2px solid var(--accent);
            padding: 14px 18px 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: calc(100vh - 110px);
            box-sizing: border-box;
        }

        #messages {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

            .message.summarized {
                opacity: 0.45;
            }

        .avatar {
            flex: 0 0 32px;
            height: 32px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

            .avatar.user {
                background: #1a2026;
                color: var(--text-muted);
            }

            .avatar.closure {
                background: #1f252b;
                border-bottom: 2px solid var(--accent);
                color: var(--accent);
            }

        .message-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .name {
            font-size: 13px;
            letter-spacing: 0.14em;
        }

            .name.user {
                color: var(--name-user);
            }

            .name.closure {
                color: var(--accent);
            }

        .meta-line {
            font-size: 11px;
            color: var(--text-faint);
            margin-left: 6px;
        }

        .text {
            margin: 0;
            white-space: pre-wrap;
        }

            .text.user {
                color: var(--text-body);
            }

            .text.closure {
                color: var(--text-strong);
            }

        details.worked {
            border-left: 1px solid var(--line);
            padding-left: 10px;
        }

            details.worked > summary {
                font: 12px 'JetBrains Mono', monospace;
                color: var(--text-muted);
                cursor: pointer;
                min-height: 24px;
            }

        .thinking-text {
            font-style: italic;
            font-size: 13px;
            color: var(--name-user);
            white-space: pre-wrap;
            margin-top: 6px;
        }

        .tool-step {
            font: 12px 'JetBrains Mono', monospace;
            color: var(--text-muted);
            margin-top: 6px;
            white-space: pre-wrap;
        }

        .tool-chip {
            padding: 3px 8px;
            background: var(--chip);
            color: var(--accent);
        }

        .memory-chip {
            align-self: flex-start;
            padding: 4px 8px;
            border: 1px solid var(--line);
            font: 11px 'JetBrains Mono', monospace;
            color: var(--text-body);
        }

            .memory-chip .dot {
                color: var(--accent);
            }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font: 12px 'JetBrains Mono', monospace;
            color: var(--text-muted);
        }

            .status::before {
                content: '';
                flex: 0 0 8px;
                height: 8px;
                background: var(--accent);
            }

            .status.error {
                color: var(--danger);
            }

                .status.error::before {
                    background: var(--danger);
                }

        .separator {
            display: flex;
            align-items: center;
            gap: 10px;
            font: 11px 'JetBrains Mono', monospace;
            color: var(--text-faint);
        }

            .separator::before, .separator::after {
                content: '';
                flex: 1;
                height: 1px;
                background: var(--line);
            }

            .separator button {
                background: none;
                border: 0;
                padding: 0;
                color: var(--accent-link);
                font: inherit;
                cursor: pointer;
                text-decoration: underline;
            }

        .summary-panel {
            background: var(--panel-raised);
            border: 1px solid var(--line-strong);
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-body);
            white-space: pre-wrap;
        }

        form {
            position: sticky;
            bottom: 0;
            background: var(--panel);
            padding: 10px 0 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .say {
            font-size: 14px;
            letter-spacing: 0.16em;
            color: var(--text-faint);
            align-self: center;
        }

        textarea {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid var(--line);
            background: var(--ground);
            color: var(--text-strong);
            font: 15px Barlow, sans-serif;
            resize: vertical;
        }

        .send {
            min-height: 44px;
            padding: 0 18px;
            border: 0;
            background: var(--accent);
            color: var(--ground);
            font-size: 15px;
            letter-spacing: 0.16em;
            cursor: pointer;
        }

        .stop {
            min-height: 44px;
            padding: 0 12px;
            border: 1px solid #5a3a3a;
            background: transparent;
            color: var(--danger);
            font-size: 13px;
            letter-spacing: 0.14em;
            cursor: pointer;
        }

        .think-row {
            display: flex;
            gap: 4px;
            align-items: center;
            font: 11px 'JetBrains Mono', monospace;
        }

        .think-row-label {
            color: var(--text-faint);
            margin-right: 4px;
        }

        .think-option {
            min-height: 30px;
            padding: 0 10px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-muted);
            font: inherit;
            cursor: pointer;
        }

            .think-option[aria-checked="true"] {
                border-color: var(--accent);
                background: var(--chip);
                color: var(--accent);
            }

        @media (max-width: 760px) {
            .page {
                flex-direction: column;
                padding: 12px 16px;
            }

            nav.chats {
                position: static;
                flex-basis: auto;
                width: 100%;
                max-height: 30vh;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <nav class="chats" aria-label="Chats">
            <button type="button" class="new-chat cut-small label" id="newChatButton">+ NEW CHAT</button>
            <div id="chatList"></div>
        </nav>

        <main>
            <header>
                <div class="identity">
                    <div class="portrait cut-small label" role="img" aria-label="Closure's portrait">C</div>
                    <div>
                        <span class="identity-name label">CLOSURE</span>
                        <span class="identity-line">Rhodes test page</span>
                    </div>
                </div>
                <span class="header-chip mono" id="headerChip">RHODES</span>
            </header>

            <section class="conversation cut" aria-label="Conversation">
                <div id="messages"></div>
                <form id="messageForm">
                    <div class="input-row">
                        <label for="messageInput" class="say label">SAY</label>
                        <textarea id="messageInput" rows="1" placeholder="talk to Closure · /quick skips thinking, /think forces it"></textarea>
                        <button type="submit" class="send cut-small label">SEND</button>
                        <button type="button" class="stop label" id="stopButton">■ STOP</button>
                    </div>
                    <div class="think-row" role="radiogroup" aria-label="Thinking">
                        <span class="think-row-label">THINK</span>
                        <button type="button" class="think-option" role="radio" aria-checked="true" data-value="auto">AUTO</button>
                        <button type="button" class="think-option" role="radio" aria-checked="false" data-value="on">ON</button>
                        <button type="button" class="think-option" role="radio" aria-checked="false" data-value="off">OFF</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script>
        const messagesElement = document.getElementById('messages');
        const chatListElement = document.getElementById('chatList');
        const messageInput = document.getElementById('messageInput');
        const conversationStorageKey = 'rhodesConversationId';
        let currentAbortController = null;
        let currentConversationId = readStoredConversationId();
        let thinkingSetting = 'auto';

        function readStoredConversationId() {
            try { return localStorage.getItem(conversationStorageKey); } catch { return null; }
        }

        function storeConversationId(conversationId) {
            currentConversationId = conversationId;
            try {
                if (conversationId) localStorage.setItem(conversationStorageKey, conversationId);
                else localStorage.removeItem(conversationStorageKey);
            } catch { }
        }

        function addElement(parentElement, tagName, className, text) {
            const newElement = document.createElement(tagName);
            if (className) newElement.className = className;
            if (text !== undefined && text !== null) newElement.textContent = text;
            parentElement.appendChild(newElement);
            return newElement;
        }

        function createElementBefore(beforeElement, tagName, className, text) {
            const newElement = document.createElement(tagName);
            if (className) newElement.className = className;
            if (text !== undefined && text !== null) newElement.textContent = text;
            beforeElement.parentElement.insertBefore(newElement, beforeElement);
            return newElement;
        }

        function scrollToBottomIf(wasNearBottom) {
            if (wasNearBottom) window.scrollTo(0, document.body.scrollHeight);
        }

        function isNearBottom() {
            return window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
        }

        function createUserMessage(messageText, isSummarized) {
            const messageElement = addElement(messagesElement, 'div', 'message' + (isSummarized ? ' summarized' : ''));
            addElement(messageElement, 'div', 'avatar user cut-small label', 'S');
            const bodyElement = addElement(messageElement, 'div', 'message-body');
            addElement(bodyElement, 'span', 'name user label', 'SHAPTO');
            addElement(bodyElement, 'p', 'text user', messageText);
        }

        function createClosureMessage(isSummarized) {
            const messageElement = addElement(messagesElement, 'div', 'message' + (isSummarized ? ' summarized' : ''));
            addElement(messageElement, 'div', 'avatar closure cut-small label', 'C');
            const bodyElement = addElement(messageElement, 'div', 'message-body');
            const nameLine = addElement(bodyElement, 'div');
            addElement(nameLine, 'span', 'name closure label', 'CLOSURE');
            const metaLine = addElement(nameLine, 'span', 'meta-line mono');
            const workedDetails = addElement(bodyElement, 'details', 'worked');
            const workedSummary = addElement(workedDetails, 'summary', null, 'THINKING');
            const thinkingText = addElement(workedDetails, 'div', 'thinking-text');
            workedDetails.hidden = true;
            return { bodyElement, metaLine, workedDetails, workedSummary, thinkingText, toolCount: 0 };
        }

        function updateWorkedSummary(closureMessage) {
            const parts = [];
            if (closureMessage.thinkingText.textContent.length > 0) parts.push('THOUGHT · ' + closureMessage.thinkingText.textContent.length.toLocaleString() + ' CHARS');
            if (closureMessage.toolCount > 0) parts.push(closureMessage.toolCount + (closureMessage.toolCount === 1 ? ' TOOL' : ' TOOLS'));
            closureMessage.workedSummary.textContent = parts.join(' · ') || 'THINKING';
            closureMessage.workedDetails.hidden = parts.length === 0;
        }

        function addToolStep(closureMessage, toolName, argumentsText, resultText) {
            const stepElement = addElement(closureMessage.workedDetails, 'div', 'tool-step');
            addElement(stepElement, 'span', 'tool-chip', toolName + (argumentsText ? ' ' + argumentsText : ''));
            addElement(stepElement, 'span', null, '\n→ ' + resultText);
            closureMessage.toolCount++;
            updateWorkedSummary(closureMessage);
        }

        function addMemoryChip(closureMessage, memoryLine) {
            const chipElement = createElementBefore(closureMessage.workedDetails, 'span', 'memory-chip');
            addElement(chipElement, 'span', 'dot', '● ');
            chipElement.appendChild(document.createTextNode('RECALLED · ' + (memoryLine.length > 90 ? memoryLine.slice(0, 90) + '…' : memoryLine)));
        }

        function addCompactionSeparator(summaryText, coveredMessageCount) {
            const separatorElement = addElement(messagesElement, 'div', 'separator');
            separatorElement.setAttribute('role', 'separator');
            const separatorLabel = addElement(separatorElement, 'span', null, coveredMessageCount + ' EARLIER MESSAGES SUMMARIZED · ');
            const viewButton = addElement(separatorLabel, 'button', null, 'VIEW');
            viewButton.type = 'button';
            const summaryPanel = addElement(messagesElement, 'div', 'summary-panel cut', summaryText || '(only old tool results were collapsed)');
            summaryPanel.hidden = true;
            viewButton.addEventListener('click', () => {
                summaryPanel.hidden = !summaryPanel.hidden;
                viewButton.textContent = summaryPanel.hidden ? 'VIEW' : 'HIDE';
            });
        }

        function formatWhen(isoText) {
            const when = new Date(isoText);
            const isToday = when.toDateString() === new Date().toDateString();
            return isToday ? when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : when.toLocaleDateString();
        }

        async function refreshChatList() {
            const response = await fetch('/chats');
            if (!response.ok) return;
            const chatSummaries = await response.json();
            chatListElement.textContent = '';
            let currentGroup = null;
            for (const chatSummary of chatSummaries) {
                const isToday = new Date(chatSummary.updatedAt).toDateString() === new Date().toDateString();
                const groupName = isToday ? 'TODAY' : 'EARLIER';
                if (groupName !== currentGroup) {
                    addElement(chatListElement, 'div', 'group-label mono', groupName);
                    currentGroup = groupName;
                }
                const chatButton = addElement(chatListElement, 'button', 'chat-entry' + (chatSummary.id === currentConversationId ? ' active' : ''));
                chatButton.type = 'button';
                addElement(chatButton, 'span', 'chat-title', chatSummary.title || 'untitled');
                addElement(chatButton, 'span', 'chat-meta', chatSummary.messageCount + ' msg · ' + formatWhen(chatSummary.updatedAt) + (chatSummary.compacted ? ' · compacted' : ''));
                chatButton.addEventListener('click', () => openConversation(chatSummary.id));
            }
        }

        async function openConversation(conversationId) {
            if (currentAbortController) return;
            storeConversationId(conversationId);
            messagesElement.textContent = '';
            await loadConversation(conversationId);
            refreshChatList();
        }

        async function loadConversation(conversationId) {
            const response = await fetch('/chats/' + conversationId);
            if (!response.ok) {
                storeConversationId(null);
                return;
            }
            const conversationView = await response.json();
            const summaryBoundary = conversationView.summaryCoversThrough;
            let separatorPlaced = summaryBoundary === 0;
            let closureMessage = null;

            for (const displayMessage of conversationView.messages) {
                if (!separatorPlaced && displayMessage.index >= summaryBoundary) {
                    addCompactionSeparator(conversationView.summary, summaryBoundary);
                    separatorPlaced = true;
                    closureMessage = null;
                }
                const isSummarized = displayMessage.index < summaryBoundary;
                if (displayMessage.role === 'user') {
                    createUserMessage(displayMessage.text, isSummarized);
                    closureMessage = null;
                    continue;
                }
                if (!closureMessage) closureMessage = createClosureMessage(isSummarized);
                if (displayMessage.role === 'tool') {
                    addToolStep(closureMessage, displayMessage.toolName || 'tool', '', displayMessage.text.length > 300 ? displayMessage.text.slice(0, 300) + '…' : displayMessage.text);
                } else if (displayMessage.role === 'assistant') {
                    if (displayMessage.reasoning) {
                        closureMessage.thinkingText.textContent += (closureMessage.thinkingText.textContent ? '\n\n' : '') + displayMessage.reasoning;
                        updateWorkedSummary(closureMessage);
                    }
                    if (displayMessage.text) addElement(closureMessage.bodyElement, 'p', 'text closure', displayMessage.text);
                }
            }
            if (!separatorPlaced) addCompactionSeparator(conversationView.summary, summaryBoundary);
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function sendMessage(messageText) {
            createUserMessage(messageText, false);
            const closureMessage = createClosureMessage(false);
            const statusLine = addElement(closureMessage.bodyElement, 'div', 'status', 'waiting…');
            let answerElement = null;
            let compactedDuringTurn = false;
            let turnFailed = false;
            window.scrollTo(0, document.body.scrollHeight);

            function currentAnswerElement() {
                if (!answerElement) answerElement = createElementBefore(statusLine, 'p', 'text closure');
                return answerElement;
            }

            function handleEvent(chatEvent) {
                const wasNearBottom = isNearBottom();
                switch (chatEvent.type) {
                    case 'conversation':
                        storeConversationId(chatEvent.text);
                        break;
                    case 'thinkingLevel':
                        closureMessage.metaLine.textContent = 'thinking ' + chatEvent.text;
                        break;
                    case 'memories':
                        for (const memoryLine of chatEvent.text.split('\n')) addMemoryChip(closureMessage, memoryLine);
                        break;
                    case 'reasoning':
                        closureMessage.thinkingText.textContent += chatEvent.text;
                        updateWorkedSummary(closureMessage);
                        statusLine.textContent = 'thinking… ' + closureMessage.thinkingText.textContent.length.toLocaleString() + ' chars';
                        break;
                    case 'content':
                        currentAnswerElement().textContent += chatEvent.text;
                        statusLine.textContent = 'writing…';
                        break;
                    case 'moveToReasoning':
                        if (answerElement) {
                            closureMessage.thinkingText.textContent += answerElement.textContent;
                            answerElement.textContent = '';
                            updateWorkedSummary(closureMessage);
                        }
                        break;
                    case 'status':
                        statusLine.hidden = false;
                        statusLine.textContent = chatEvent.text;
                        break;
                    case 'tool':
                        addToolStep(closureMessage, chatEvent.toolName, chatEvent.text, chatEvent.result);
                        answerElement = null;
                        break;
                    case 'done':
                        closureMessage.metaLine.textContent += ' · ' + chatEvent.text;
                        statusLine.hidden = true;
                        refreshChatList();
                        break;
                    case 'compacted':
                        compactedDuringTurn = true;
                        break;
                    case 'error':
                        turnFailed = true;
                        statusLine.hidden = false;
                        statusLine.className = 'status error';
                        statusLine.textContent = chatEvent.text;
                        break;
                }
                scrollToBottomIf(wasNearBottom);
            }

            currentAbortController = new AbortController();
            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText, client: 'test page', thinking: thinkingSetting, conversationId: currentConversationId }),
                    signal: currentAbortController.signal,
                });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let bufferedText = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    bufferedText += decoder.decode(value, { stream: true });
                    let separatorIndex;
                    while ((separatorIndex = bufferedText.indexOf('\n\n')) >= 0) {
                        const eventBlock = bufferedText.slice(0, separatorIndex);
                        bufferedText = bufferedText.slice(separatorIndex + 2);
                        if (eventBlock.startsWith('data: ')) handleEvent(JSON.parse(eventBlock.slice(6)));
                    }
                }
                if (!turnFailed) statusLine.hidden = true;
            } catch (requestError) {
                statusLine.hidden = false;
                statusLine.className = requestError.name === 'AbortError' ? 'status' : 'status error';
                statusLine.textContent = requestError.name === 'AbortError' ? 'stopped' : requestError.message;
            } finally {
                currentAbortController = null;
            }

            if (compactedDuringTurn) {
                messagesElement.textContent = '';
                await loadConversation(currentConversationId);
                refreshChatList();
            }
        }

        document.getElementById('messageForm').addEventListener('submit', submitEvent => {
            submitEvent.preventDefault();
            const messageText = messageInput.value.trim();
            if (!messageText || currentAbortController) return;
            messageInput.value = '';
            sendMessage(messageText);
        });

        messageInput.addEventListener('keydown', keyEvent => {
            if (keyEvent.key === 'Enter' && !keyEvent.shiftKey) {
                keyEvent.preventDefault();
                document.getElementById('messageForm').requestSubmit();
            }
        });

        document.querySelectorAll('.think-option').forEach(optionButton => {
            optionButton.addEventListener('click', () => {
                thinkingSetting = optionButton.dataset.value;
                document.querySelectorAll('.think-option').forEach(otherButton => otherButton.setAttribute('aria-checked', String(otherButton === optionButton)));
            });
        });

        document.getElementById('stopButton').addEventListener('click', () => {
            if (currentAbortController) currentAbortController.abort();
        });

        document.getElementById('newChatButton').addEventListener('click', () => {
            if (currentAbortController) return;
            storeConversationId(null);
            messagesElement.textContent = '';
            refreshChatList();
            messageInput.focus();
        });

        refreshChatList();
        if (currentConversationId) loadConversation(currentConversationId);
    </script>
</body>
</html>
